<!DOCTYPE html>
<html data-dsh-glass><head><meta charset="utf-8"><style>
body{margin:0;font:13px/1.5 system-ui;background:#111;color:#ddd}
.page{position:relative;min-height:100vh;padding:40px;
  background:repeating-linear-gradient(45deg,#5FB3B3 0 30px,#C594C5 30px 60px,#6699CC 60px 90px)}
h1{color:#fff;text-shadow:0 2px 10px #000;margin:0 0 10px}
.note{color:#fff;text-shadow:0 1px 6px #000;margin-bottom:20px}

/* 复刻宿主结构 */
.frame{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:28px;height:260px;contain:layout;pointer-events:auto}
.mark{position:absolute;left:0;right:0;height:10px;background:rgba(255,255,255,.35);border-radius:2px}
.preview{position:absolute;right:calc(100% + 10px);top:60px;width:230px;padding:10px 12px;
  border-radius:14px;color:#fff;background:var(--bg,#2A323B);
  box-shadow:0 8px 28px rgba(0,0,0,.45)}

/* ===== 我们的玻璃规则 ===== */
html[data-dsh-glass] [class*="preview"]:not([class*="dmt-"]){
  background-color:rgba(31,36,40,0.71)!important;
  backdrop-filter:blur(26px) saturate(120%)!important;
  -webkit-backdrop-filter:blur(26px) saturate(120%)!important;
  isolation:isolate;
}
/* F：给 frame 去掉 contain */
html[data-dsh-glass] [class*="frame"]:not([class*="dmt-"]){contain:none!important}
</style></head><body>
<div class="page">
<h1>方案 F：给 frame 去掉 contain:layout</h1>
<div class="note">
  左：只有玻璃规则（contain:layout 仍在）→ 应该糊不出来<br>
  右：玻璃规则 + frame 去掉 contain → 应该能看到模糊条纹
</div>

<div class="frame" style="left:120px">
  <div class="mark"></div>
  <div class="preview"><b>对照：contain:layout 仍在</b><br><span style="color:#aaa">无模糊</span></div>
</div>

<div class="frame" style="left:520px;contain:none">
  <div class="mark"></div>
  <div class="preview"><b>方案 F：contain:none</b><br><span style="color:#aaa">应该有模糊</span></div>
</div>
</div></body></html>
