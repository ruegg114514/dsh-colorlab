<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ColorLab 背景 · 光晕 / 分割 工作台</title>
<style>
  :root{--fg:#D8DEE9;--dim:#A7ADBA;--teal:#5FB3B3}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);background:#0d0f11}
  .wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}

  .panel{background:#16181b;border-right:1px solid #ffffff12;padding:14px;overflow-y:auto;max-height:100vh}
  .panel h1{font-size:14px;margin:0 0 3px}
  .panel .sub{color:var(--dim);font-size:11px;margin-bottom:14px;line-height:1.6}
  .grp{margin-bottom:14px}
  .grp>label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:6px}
  .segs{display:flex;flex-wrap:wrap;gap:4px}
  .segs button{flex:1 1 auto;min-width:44px;padding:6px 7px;font:inherit;font-size:11px;
    color:var(--dim);background:#1e2126;border:1px solid #ffffff14;border-radius:5px;
    cursor:pointer;white-space:nowrap}
  .segs button:hover{background:#262a30;color:var(--fg)}
  .segs button.on{background:#2d5f5f;border-color:#5FB3B3;color:#d9f2f2}
  input[type=range]{width:100%;accent-color:#5FB3B3}
  .row{display:flex;align-items:center;gap:8px}
  .row span{font-size:11px;color:var(--dim);min-width:34px;text-align:right}
  .hint{font-size:11px;color:#7a848f;line-height:1.6;margin-top:5px}
  .dim{opacity:.3;pointer-events:none}

  /* 光源卡 */
  .light{
    padding:7px 8px;background:#1b1e22;border:1px solid #ffffff10;
    border-radius:6px;margin-bottom:6px;
  }
  .light .top{display:flex;align-items:center;gap:7px}
  .light .idx{font-size:10px;color:#6b747e;min-width:13px}
  .light input[type=color]{
    width:26px;height:22px;padding:0;border:1px solid #ffffff20;border-radius:4px;
    background:none;cursor:pointer;flex:none;
  }
  .light input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .light input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
  .light .pct{font-size:10px;color:var(--dim);min-width:32px;text-align:right}
  .light .xy{display:flex;gap:6px;margin-top:5px}
  .light .xy label{font-size:10px;color:#6b747e;display:flex;align-items:center;gap:3px;flex:1}
  .light .xy input{flex:1;min-width:0}

  .main{padding:14px;display:flex;flex-direction:column;gap:10px}
  .stage{position:relative;height:calc(100vh - 150px);min-height:400px;border-radius:10px;
    overflow:hidden;border:1px solid #ffffff14}
  .ground{position:absolute;inset:0}
  .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
  .half:first-child{left:0}
  .half:last-child{left:50%;border-left:1px solid #ffffff26}
  .halfLabel{position:absolute;left:8px;top:6px;z-index:20;font-size:10px;
    background:#00000088;padding:2px 8px;border-radius:99px;color:#c9d1d9}
  .hazeLayer{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,255,255,var(--haze,.08)) 0%,
      rgba(255,255,255,calc(var(--haze,.08) * .35)) 40%, transparent 100%)}
  .sidebar{position:absolute;left:0;top:0;bottom:0;width:24%;
    background:rgba(35,41,46,var(--tint,.65));border-right:1px solid #ffffff10}
  .center{position:absolute;left:24%;right:0;top:0;bottom:0;background:rgba(52,61,70,var(--tint,.65))}
  .content{position:absolute;left:8%;right:8%;top:14%}
  .content h2{color:var(--teal);font-size:17px;margin:0 0 6px}
  .content p{color:var(--dim);margin:0 0 10px;line-height:1.75}
  .content code{background:rgba(153,199,148,.14);color:#99C794;padding:1px 5px;border-radius:3px}
  .composer{position:absolute;left:8%;right:8%;bottom:5%;height:64px;border-radius:12px;
    display:flex;align-items:center;padding:0 16px;background:rgba(59,69,79,var(--tint,.65));
    border:1px solid #ffffff1a;box-shadow:0 10px 32px #00000055;color:var(--dim);font-size:12px}
  .badge{position:absolute;right:12px;top:10px;font-size:11px;background:#00000066;
    border:1px solid #ffffff1a;padding:3px 9px;border-radius:99px;color:var(--dim)}
  .cssOut{background:#16181b;border:1px solid #ffffff12;border-radius:8px;padding:10px 12px;
    font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all;
    max-height:120px;overflow:auto}
  .cssOut b{color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">

  <aside class="panel">
    <h1>背景工作台</h1>
    <div class="sub">光晕 / 分割两种模式，参数都可调。</div>

    <div class="grp">
      <label>模式</label>
      <div class="segs" id="mode">
        <button data-v="glow">光晕</button>
        <button data-v="bands">分割</button>
        <button data-v="blend">叠加</button>
      </div>
    </div>

    <!-- ============ 光晕 ============ -->
    <div class="grp" id="glowGrp">
      <label>光源数量</label>
      <div class="segs" id="count">
        <button data-v="2">2</button><button data-v="3">3</button>
        <button data-v="4">4</button><button data-v="5">5</button>
        <button data-v="6">6</button>
      </div>
      <label style="margin-top:9px">光源（颜色 / 强度 / 位置）</label>
      <div id="lights"></div>
      <div class="hint">X/Y 是百分比坐标，0,0 = 左上角，100,100 = 右下角。</div>

      <label style="margin-top:9px">整体浓度</label>
      <div class="row">
        <input type="range" id="gA" min="0" max="100" value="38">
        <span id="gAV">38</span>
      </div>
      <label style="margin-top:7px">扩散范围</label>
      <div class="row">
        <input type="range" id="spread" min="40" max="140" value="100">
        <span id="spreadV">100</span>
      </div>
    </div>

    <!-- ============ 分割 ============ -->
    <div class="grp" id="bandGrp">
      <label>分割角度（0–360° 任意）</label>
      <div class="row">
        <input type="range" id="dir" min="0" max="360" value="165">
        <span id="dirV">165°</span>
      </div>
      <label style="margin-top:9px">区域数量</label>
      <div class="segs" id="bandCount">
        <button data-v="2">2</button><button data-v="3">3</button>
        <button data-v="4">4</button><button data-v="5">5</button>
        <button data-v="6">6</button>
      </div>
      <label style="margin-top:9px">每条色带颜色</label>
      <div id="bands"></div>
      <label style="margin-top:9px">边缘柔和</label>
      <div class="row">
        <input type="range" id="sf" min="0" max="100" value="2">
        <span id="sfV">2</span>
      </div>
      <div class="hint">0 = 硬边斜切；越大过渡越平滑。</div>
    </div>

    <!-- ============ 通用 ============ -->
    <div class="grp">
      <label>底色</label>
      <div class="row">
        <input type="color" id="baseColor" value="#343D46"
          style="width:34px;height:26px;padding:0;border:1px solid #ffffff20;border-radius:4px;background:none">
        <span style="font-size:11px" id="baseV">#343D46</span>
      </div>
    </div>

    <div class="grp">
      <label>三列浓度（模拟玻璃）</label>
      <div class="row">
        <input type="range" id="tint" min="0" max="100" value="65">
        <span id="tintV">65</span>
      </div>
    </div>

    <div class="grp">
      <label>白雾浓度（右栏叠加）</label>
      <div class="row">
        <input type="range" id="haze" min="0" max="30" value="8">
        <span id="hazeV">8</span>
      </div>
      <div class="hint">插件默认 8%。这层是纯白，会整体提亮、削弱光晕色相。</div>
    </div>

    <div class="grp">
      <label>预设</label>
      <div class="segs" id="presets">
        <button data-p="0">光晕3色</button>
        <button data-p="1">光晕双色</button>
        <button data-p="2">分割4区</button>
        <button data-p="3">光晕+分割</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="stage">
      <div class="half">
        <div class="halfLabel">纯背景（无遮挡）</div>
        <div class="ground" id="ground"></div>
      </div>
      <div class="half">
        <div class="halfLabel">叠三列 + 白雾后（实际所见）</div>
        <div class="ground" id="ground2"></div>
        <div class="sidebar"></div><div class="center"></div>
        <div class="hazeLayer"></div>
        <div class="content">
          <h2>探索未至之境</h2>
          <p>过程条目按类型上色，标题与行内代码着色。</p>
          <p>这是一段用于观察背景层次的正文。<code>inline code</code> 也应该清楚可读。</p>
        </div>
        <div class="composer">描述你想要构建的内容、/ 调用指令、@ 文件或对话</div>
      </div>
      <div class="badge" id="badge"></div>
    </div>
    <div class="cssOut" id="cssOut"></div>
  </main>

</div>

<script>
const S = {
  mode: 'glow',
  lights: [
    { color: '#5FB3B3', strength: 100, x: 16, y: 10 },
    { color: '#C594C5', strength: 85,  x: 84, y: 18 },
    { color: '#6699CC', strength: 70,  x: 52, y: 94 },
  ],
  gA: 38, spread: 100,
  dir: '165', sf: 2,
  /* 每条色带独立颜色（与光源一样可自选） */
  bands: [
    { color: '#414B55' },
    { color: '#38414A' },
    { color: '#2F373F' },
    { color: '#272E35' },
  ],
  base: '#343D46', tint: 65, haze: 8,
}

const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16))
const rgb2hex = a => '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')
const mix = (a,b,t) => rgb2hex(hex2rgb(a).map((v,i) => v + (hex2rgb(b)[i]-v)*t))
const lighten = (h,t) => mix(h,'#ffffff',t)
const darken  = (h,t) => mix(h,'#000000',t)
const rgba = (h,a) => { const [r,g,b]=hex2rgb(h); return `rgba(${r}, ${g}, ${b}, ${a})` }

/* ===== 光源列表 ===== */
function renderLights(){
  const box = document.getElementById('lights')
  box.innerHTML = ''
  S.lights.forEach((L, i) => {
    const el = document.createElement('div')
    el.className = 'light'
    el.innerHTML = `
      <div class="top">
        <span class="idx">${i+1}</span>
        <input type="color" value="${L.color}">
        <input type="range" min="0" max="100" value="${L.strength}">
        <span class="pct">${L.strength}%</span>
      </div>
      <div class="xy">
        <label>X<input type="range" min="0" max="100" value="${L.x}" data-k="x"></label>
        <label>Y<input type="range" min="0" max="100" value="${L.y}" data-k="y"></label>
      </div>`
    el.querySelector('input[type=color]').addEventListener('input', e => {
      S.lights[i].color = e.target.value; render()
    })
    el.querySelector('.top input[type=range]').addEventListener('input', e => {
      S.lights[i].strength = Number(e.target.value)
      el.querySelector('.pct').textContent = e.target.value + '%'
      render()
    })
    el.querySelectorAll('.xy input').forEach(inp => {
      inp.addEventListener('input', e => {
        S.lights[i][e.target.dataset.k] = Number(e.target.value); render()
      })
    })
    box.appendChild(el)
  })
}

/* ===== 色带列表 ===== */
function renderBands(){
  const box = document.getElementById('bands')
  box.innerHTML = ''
  S.bands.forEach((b, i) => {
    const el = document.createElement('div')
    el.className = 'light'
    el.innerHTML = `
      <div class="top">
        <span class="idx">${i+1}</span>
        <input type="color" value="${b.color}">
        <span class="pct" style="min-width:auto;flex:1;text-align:left;color:#8a939d">${b.color}</span>
      </div>`
    el.querySelector('input[type=color]').addEventListener('input', e => {
      S.bands[i].color = e.target.value
      el.querySelector('.pct').textContent = e.target.value
      render()
    })
    box.appendChild(el)
  })
}

/* ===== 光晕 ===== */
function buildGlow(){
  const a = S.gA / 100
  const sp = S.spread / 100
  const rx = Math.round(70 * sp), ry = Math.round(60 * sp)
  return S.lights.map(L =>
    `radial-gradient(${rx}% ${ry}% at ${L.x}% ${L.y}%, ${rgba(L.color, a * L.strength/100)}, transparent 70%)`
  ).concat(S.base).join(',\n  ')
}

/* ===== 分割 ===== */
function buildBands(){
  const n = S.bands.length
  const soft = S.sf / 100
  const gap = soft * (100 / n) * 0.95

  const stops = []
  S.bands.forEach((b, i) => {
    const c = b.color
    const start = (i / n) * 100, end = ((i + 1) / n) * 100
    if (i === 0) { stops.push(`${c} 0%`); stops.push(`${c} ${(end - gap/2).toFixed(2)}%`) }
    else if (i === n - 1) { stops.push(`${c} ${(start + gap/2).toFixed(2)}%`); stops.push(`${c} 100%`) }
    else { stops.push(`${c} ${(start + gap/2).toFixed(2)}%`); stops.push(`${c} ${(end - gap/2).toFixed(2)}%`) }
  })
  return `linear-gradient(${S.dir}deg,\n    ${stops.join(',\n    ')})`
}

function build(){
  if (S.mode === 'glow') return buildGlow()
  if (S.mode === 'bands') return buildBands()
  return buildBands() + ',\n  ' + buildGlow()
}

function render(){
  const css = build()
  document.getElementById('ground').style.background = css
  document.getElementById('ground2').style.background = css
  document.documentElement.style.setProperty('--haze', (S.haze ?? 8) / 100)
  document.documentElement.style.setProperty('--tint', S.tint/100)

  document.getElementById('badge').textContent =
    S.mode === 'glow' ? `光晕 · ${S.lights.length} 光源 · ${S.gA}%`
    : S.mode === 'bands' ? `分割 · ${S.dir}° · ${S.bands.length}区`
    : `叠加 · ${S.lights.length}光源 + ${S.bands.length}区`

  document.getElementById('cssOut').innerHTML = '<b>background:</b>\n  ' + css

  for (const [id,v] of [['mode',S.mode]])
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)))
  document.querySelectorAll('#count button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === S.lights.length))
  document.querySelectorAll('#bandCount button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === S.bands.length))

  document.getElementById('gAV').textContent = S.gA
  document.getElementById('spreadV').textContent = S.spread
  document.getElementById('sfV').textContent = S.sf
  document.getElementById('tintV').textContent = S.tint
  document.getElementById('baseV').textContent = S.base
  const dirEl = document.getElementById('dir')
  if (dirEl) { dirEl.value = S.dir; document.getElementById('dirV').textContent = S.dir + '°' }
  const hz = document.getElementById('haze')
  if (hz) { hz.value = S.haze ?? 8; document.getElementById('hazeV').textContent = S.haze ?? 8 }

  document.getElementById('glowGrp').classList.toggle('dim', S.mode === 'bands')
  document.getElementById('bandGrp').classList.toggle('dim', S.mode === 'glow')
}

/* ===== 按数量生成默认色带（同色系明暗阶梯） ===== */
function defaultBands(n){
  const out = []
  for (let i = 0; i < n; i++) {
    const t = i / Math.max(1, n - 1)
    const lum = (0.42 - t) * 0.55
    out.push({ color: lum >= 0 ? lighten(S.base, lum) : darken(S.base, -lum) })
  }
  return out
}

/* ===== 事件 ===== */
document.getElementById('mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  S.mode = b.dataset.v; render()
})
document.getElementById('count').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  const n = Number(b.dataset.v)
  const PAL = ['#5FB3B3','#C594C5','#6699CC','#99C794','#F9AE58','#EC5F67']
  const POS = [{x:16,y:10},{x:84,y:18},{x:52,y:94},{x:8,y:78},{x:92,y:82},{x:50,y:46}]
  while (S.lights.length < n) {
    const i = S.lights.length
    S.lights.push({ color: PAL[i % PAL.length], strength: 80, x: POS[i].x, y: POS[i].y })
  }
  S.lights.length = n
  renderLights(); render()
})
document.getElementById('dir').addEventListener('input', e => {
  S.dir = e.target.value; render()
})
document.getElementById('bandCount').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  const n = Number(b.dataset.v)
  /* 保留已有颜色，只补/删到目标数量 */
  while (S.bands.length < n) {
    const auto = defaultBands(n)
    S.bands.push(auto[S.bands.length] || { color: S.base })
  }
  S.bands.length = n
  renderBands(); render()
})
for (const id of ['gA','spread','sf','tint'])
  document.getElementById(id).addEventListener('input', e => { S[id] = Number(e.target.value); render() })
document.getElementById('baseColor').addEventListener('input', e => { S.base = e.target.value; render() })
document.getElementById('haze').addEventListener('input', e => { S.haze = Number(e.target.value); render() })

/* ===== 预设 ===== */
const PRESETS = {
  0: { mode:'glow', lights:[
        {color:'#5FB3B3',strength:100,x:16,y:10},
        {color:'#C594C5',strength:85,x:84,y:18},
        {color:'#6699CC',strength:70,x:52,y:94}], gA:38, spread:100, base:'#343D46',
       bands:[{color:'#414B55'},{color:'#38414A'},{color:'#2F373F'},{color:'#272E35'}], sf:2 },
  1: { mode:'glow', lights:[
        {color:'#5FB3B3',strength:100,x:14,y:8},
        {color:'#F9AE58',strength:70,x:88,y:92}], gA:40, spread:110, base:'#343D46',
       bands:[{color:'#414B55'},{color:'#272E35'}], sf:2 },
  2: { mode:'bands', dir:'165', sf:2,
       lights:[{color:'#5FB3B3',strength:100,x:16,y:10}], gA:38, spread:100, base:'#343D46',
       bands:[{color:'#4A555F'},{color:'#3D4650'},{color:'#333B44'},{color:'#2A3138'}] },
  3: { mode:'blend', dir:'135', sf:14,
       lights:[{color:'#5FB3B3',strength:100,x:16,y:10},
               {color:'#C594C5',strength:80,x:84,y:20}], gA:30, spread:105, base:'#343D46',
       bands:[{color:'#3A4450'},{color:'#323B45'},{color:'#2B333B'}] },
}
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  Object.assign(S, JSON.parse(JSON.stringify(PRESETS[b.dataset.p])))
  document.getElementById('gA').value = S.gA
  document.getElementById('spread').value = S.spread
  document.getElementById('sf').value = S.sf
  document.getElementById('baseColor').value = S.base
  renderLights(); renderBands(); render()
  document.querySelectorAll('#presets button').forEach(x => x.classList.remove('on'))
  b.classList.add('on')
})

renderLights()
renderBands()
render()
</script>
</body>
</html>
